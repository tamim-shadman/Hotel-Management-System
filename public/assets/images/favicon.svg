<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 24K Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7A1E" />
      <stop offset="100%" stop-color="#F5E08E" />
    </linearGradient>

    <!-- Obsidian Slate Glass Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Specular Sheen Filter -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1">
        <animate attributeName="offset" values="-0.5; 1.5" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCrest {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.02); opacity: 1; filter: drop-shadow(0 0 4px rgba(212,175,55,0.7)); }
    }
    .crown-star {
      transform-origin: 32px 14px;
      animation: pulseCrest 3s ease-in-out infinite;
    }
  </style>

  <!-- Obsidian Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.8" />

  <!-- Inner Architectural Filigree Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D4AF37" stroke-width="0.6" stroke-dasharray="1.5, 2.5" opacity="0.4" />

  <!-- Royal Crest Crown Points -->
  <g filter="url(#goldGlow)">
    <!-- Central Majestic Diamond Star -->
    <path class="crown-star" d="M32 7 L34.5 13 L40.5 14 L35.5 18 L37.5 24 L32 20.5 L26.5 24 L28.5 18 L23.5 14 L29.5 13 Z" fill="url(#sheen)" />

    <!-- Architectural Chevron Monogram 'A' -->
    <!-- Left Pillar -->
    <path d="M32 17 L17 48 L22.5 48 L32 27 L41.5 48 L47 48 Z" fill="url(#goldGrad)" />

    <!-- Sleek Crossbar with Diamond Cutout -->
    <path d="M22 38 L42 38 L40.5 41 L23.5 41 Z" fill="url(#goldGrad)" />
    
    <!-- Inner Sanctum Keystone Diamond -->
    <polygon points="32,29 36,36 32,43 28,36" fill="#0A0E1A" stroke="url(#sheen)" stroke-width="1" />
    <circle cx="32" cy="36" r="1.5" fill="#FFE89E" />
  </g>
</svg>
