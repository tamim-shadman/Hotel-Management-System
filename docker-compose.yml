services:
  aura-grand-pms:
    build: .
    container_name: aura_grand_hotel_pms
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=aura_grand_super_luxury_secret_production_2026
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
